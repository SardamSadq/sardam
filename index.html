    <script>
      // Gracefully handle iframe WebSocket HMR disconnections in dev environment
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) || '';
        if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1) {
          event.preventDefault();
        }
      });
    </script>
