name: Build QISTYAR Windows 64-bit EXE
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web Frontend (React + Vite)
        run: npm run build

      - name: Bundle Production Server with esbuild
        run: |
          npx esbuild server.ts --bundle --platform=node --target=node20 --format=cjs --outfile=dist-desktop/bundle.cjs --external:vite

      - name: Build Windows Executable (QISTYAR.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-desktop"
          
          # Attempt 1: Fast & reliable standalone package compilation via @yao-pkg/pkg
          Write-Host "Attempting build via @yao-pkg/pkg..."
          try {
              npx --yes @yao-pkg/pkg dist-desktop/bundle.cjs --targets node20-win-x64 --output dist-desktop/QISTYAR.exe
          } catch {
              Write-Host "pkg encountered an issue, trying SEA fallback..."
          }

          # Attempt 2: Node Single Executable Application (SEA) fallback if needed
          if (-not (Test-Path "dist-desktop/QISTYAR.exe")) {
              Write-Host "Running Node.js SEA build with signature removal..."
              $seaConfig = @{
                  main = "dist-desktop/bundle.cjs"
                  output = "dist-desktop/sea-prep.blob"
                  disableExperimentalSEAWarning = $true
              } | ConvertTo-Json
              Set-Content -Path "dist-desktop/sea-config.json" -Value $seaConfig
              node --experimental-sea-config dist-desktop/sea-config.json
              
              $nodePath = (Get-Command node).Source
              Copy-Item $nodePath -Destination "dist-desktop/QISTYAR.exe"
              
              # Locate signtool in Windows SDK and remove signature from node.exe copy
              $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
              if ($signtool) {
                  Write-Host "Removing digital signature using $signtool ..."
                  & "$signtool" remove /s dist-desktop/QISTYAR.exe
              }
              
              npx --yes postject dist-desktop/QISTYAR.exe NODE_SEA_BLOB dist-desktop/sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2
          }

      - name: Assemble Windows Standalone Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "QISTYAR-Windows"
          if (Test-Path "dist-desktop/QISTYAR.exe") {
              Copy-Item "dist-desktop/QISTYAR.exe" -Destination "QISTYAR-Windows/"
          }
          Copy-Item -Recurse "dist" -Destination "QISTYAR-Windows/"
          Copy-Item -Recurse "data" -Destination "QISTYAR-Windows/"
          Copy-Item "Start-QISTYAR.bat" -Destination "QISTYAR-Windows/"
          Copy-Item "Start-QISTYAR-Silent.vbs" -Destination "QISTYAR-Windows/"
          Copy-Item "README-Windows.txt" -Destination "QISTYAR-Windows/"
          Copy-Item "Build-Windows-EXE.bat" -Destination "QISTYAR-Windows/"

      - name: Compress to ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "QISTYAR-Windows/*" -DestinationPath "QISTYAR-Windows-64bit.zip" -Force

      - name: Upload Windows 64-bit EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QISTYAR-Windows-64bit-EXE
          path: QISTYAR-Windows-64bit.zip
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-windows
          name: "QISTYAR Windows Application (v1.0.0)"
          body: |
            ## سیستەمی بەڕێوەبردنی قیست و سەرمایە (QISTYAR) - وەشانی کۆمپیوتەر
            
            فایلی زیپی خوارەوە دابگرە، دەریبهێنە (Extract)، و کلیک لەسەر `QISTYAR.exe` بکە:
            - کاردەکات 100% بەبێ ئینتەرنێت (ئۆفلاین).
            - هەموو داتاکان لە فۆڵدەری `data/db.json` پارێزراون.
            - دەتوانیت لە ڕێگەی Wi-Fi یان هۆتسپۆت ڕاستەوخۆ بە مۆبایلەکەتەوە بیبەستیتەوە.
          files: QISTYAR-Windows-64bit.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
