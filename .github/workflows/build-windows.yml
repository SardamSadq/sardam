name: Build QISTYAR Windows 64-bit EXE
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps --ignore-engines

      - name: Build Web Frontend (React + Vite)
        run: npm run build

      - name: Bundle Production Server with esbuild
        run: |
          npx esbuild server.ts --bundle --platform=node --target=node22 --format=cjs --outfile=dist-desktop/server.cjs --external:vite

      - name: Compile Native Windows Launcher (QISTYAR.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-desktop"
          
          # Find Microsoft C# Compiler (csc.exe) preinstalled on all Windows runners
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $csc)) {
              $csc = "C:\Windows\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          }
          if (-not (Test-Path $csc)) {
              $csc = (Get-ChildItem -Path "C:\Windows\Microsoft.NET" -Filter "csc.exe" -Recurse | Select-Object -First 1).FullName
          }
          
          Write-Host "Compiling native Windows GUI launcher using $csc ..."
          & $csc /target:winexe /out:dist-desktop\QISTYAR.exe Launcher.cs
          
          # Copy portable node.exe so application is 100% standalone
          $nodeSource = (Get-Command node).Source
          Copy-Item $nodeSource -Destination "dist-desktop\node.exe"
          
          Write-Host "Native QISTYAR.exe built successfully!"

      - name: Assemble Windows Standalone Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "QISTYAR-Windows"
          Copy-Item "dist-desktop\QISTYAR.exe" -Destination "QISTYAR-Windows\"
          Copy-Item "dist-desktop\node.exe" -Destination "QISTYAR-Windows\"
          Copy-Item "dist-desktop\server.cjs" -Destination "QISTYAR-Windows\"
          Copy-Item -Recurse "dist" -Destination "QISTYAR-Windows\"
          Copy-Item -Recurse "data" -Destination "QISTYAR-Windows\"
          Copy-Item "Start-QISTYAR.bat" -Destination "QISTYAR-Windows\"
          Copy-Item "Start-QISTYAR-Silent.vbs" -Destination "QISTYAR-Windows\"
          Copy-Item "README-Windows.txt" -Destination "QISTYAR-Windows\"

      - name: Compress to ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "QISTYAR-Windows\*" -DestinationPath "QISTYAR-Windows-64bit.zip" -Force

      - name: Upload Windows 64-bit EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QISTYAR-Windows-64bit-EXE
          path: QISTYAR-Windows-64bit.zip
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.0-windows
          name: "QISTYAR Windows Application (v1.0.0)"
          body: |
            ## سیستەمی بەڕێوەبردنی قیست و سەرمایە (QISTYAR) - وەشانی کۆمپیوتەر
            
            فایلی زیپی خوارەوە دابگرە، دەریبهێنە (Extract)، و کلیک لەسەر `QISTYAR.exe` بکە:
            - کاردەکات 100% بەبێ ئینتەرنێت (ئۆفلاین).
            - هەموو داتاکان لە فۆڵدەری `data/db.json` پارێزراون.
            - دەتوانیت لە ڕێگەی Wi-Fi یان هۆتسپۆت ڕاستەوخۆ بە مۆبایلەکەتەوە بیبەستیتەوە.
          files: QISTYAR-Windows-64bit.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
